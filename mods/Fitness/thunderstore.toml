[config]
schemaVersion = "0.0.1"

[package]
namespace = "Jarki"
name = "Fitness"
versionNumber = "0.1.4"
description = "Train Run on a buildable deer-hide treadmill with personal kilometre and estimated calorie totals. Manage muscle strain, native stamina and automatic recovery walking. Configurable training multipliers."
websiteUrl = "https://github.com/Jarki/valheim-mods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "package/icon.png"
readme = "package/README.md"
outdir = "../../dist"

[[build.copy]]
source = "bin/Release/netstandard2.1/Fitness.dll"
target = "plugins/Jarki-Fitness/Fitness.dll"

[[build.copy]]
source = "package/CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "../../LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "ai-generated"]
