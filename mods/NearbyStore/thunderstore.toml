[config]
schemaVersion = "0.0.1"

[package]
namespace = "Jarki"
name = "NearbyStore"
versionNumber = "1.0.0"
description = "Store inventory items in nearby chests with one button. Favorite stacks with Alt+F to keep them carried. Client-side with configurable range."
websiteUrl = "https://github.com/Jarki/valheim-mods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "package/icon.png"
readme = "package/README.md"
outdir = "../../dist"

[[build.copy]]
source = "bin/Release/netstandard2.1/NearbyStore.dll"
target = "plugins/NearbyStore/NearbyStore.dll"

[[build.copy]]
source = "package/CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "../../LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "ai-generated", "client-side", "utility"]
