[config]
schemaVersion = "0.0.1"

[package]
namespace = "Jarki"
name = "Startup_Helper"
versionNumber = "1.0.0"
description = "Client-only automatic selection of an existing character and private world, or one server join attempt."
websiteUrl = "https://github.com/Jarki/valheim-mods/tree/main/mods/StartupHelper"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "package/icon.png"
readme = "package/README.md"
outdir = "../../dist"

[[build.copy]]
source = "bin/Release/netstandard2.1/StartupHelper.dll"
target = "plugins/StartupHelper/StartupHelper.dll"

[[build.copy]]
source = "package/CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "../../LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "ai-generated", "client-side", "utility"]
